<!DOCTYPE html>
<html>
    <head>
        <title>Flood prone district</title>
        <link rel="stylesheet" href="flood.css">
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">

    <body>
        <a href="main.html" class="goback">Go Back ←</a>

        <header>

        <main>
            <p id="update">Loading the calculation in percentage...</p>
